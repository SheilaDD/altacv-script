<style>
  /* --- 1. MODAL/POPUP STYLES (NEW) --- */
  /* Backdrop covers the whole screen and makes it dark/dim */
  .modal-backdrop {
    display: none; /* Initially hidden */
    position: fixed;
    z-index: 1000; /* Ensure it's on top of everything */
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.7); /* Black with 70% opacity */
    /* Use flexbox to center the content */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* When the modal is open, this class is added to the backdrop */
  .modal-backdrop.open {
    display: flex; /* Show the modal */
  }

  /* Close button styling */
  .close-button {
    color: #aaaaaa;
    font-size: 28px;
    font-weight: bold;
    position: absolute; /* Position relative to the #ticket-container */
    top: 10px;
    right: 15px;
    cursor: pointer;
    transition: color 0.3s;
  }

  .close-button:hover,
  .close-button:focus {
    color: #da291c; /* South Africa Red for hover */
  }

  /* --- 2. ORIGINAL TICKET CONTAINER STYLES (MODIFIED) --- */
  #ticket-container {
    /* Changed position to relative so the close button can be absolute inside it */
    position: relative;
    max-width: 600px;
    margin: 0; /* Remove margin-auto because flexbox is centering it now */
    padding: 20px;
    border: 2px solid #00a3da; /* South Africa blue/sky blue */
    border-radius: 12px;
    background-color: #f7f9fc;
    text-align: center;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* Slightly stronger shadow for pop-up effect */
    /* Add animation for entry */
    animation: fadeIn 0.3s ease-out;
  }

  /* Animation for the pop-up effect */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: scale(0.9);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* Mobile-first styling */
  /* ... rest of your original CSS */
  .ticket-heading {
    color: #00a3da;
    font-size: 1.5em;
    margin-bottom: 5px;
  }
  .share-prompt {
    font-weight: bold;
    color: #333;
    margin-bottom: 20px;
  }
  .counter-display {
    font-size: 2em;
    color: #da291c; /* South Africa red */
    margin: 15px 0;
  }
  .share-button {
    display: block;
    width: 90%;
    padding: 15px;
    margin: 10px auto;
    font-size: 1.1em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  #whatsapp-share {
    background-color: #25d366; /* WhatsApp Green */
    color: white;
  }
  #whatsapp-share:hover {
    background-color: #1da851;
  }
  #claim-button {
    background-color: #ffb612; /* Bafana Bafana Yellow/Gold */
    color: #333;
    font-weight: bold;
    opacity: 0.5; /* Disabled look */
    pointer-events: none; /* Make it unclickable */
  }
  #claim-button.active {
    opacity: 1;
    pointer-events: auto;
    background-color: #ffc72c;
  }
</style>

<div id="ticketModal" class="modal-backdrop">
  <div id="ticket-container">
    <span class="close-button" onclick="closeModal()">&times;</span>

    <h1 class="ticket-heading">WIN BAFANA BAFANA TICKETS!!</h1>
    <p class="share-prompt">16/Dec/2026- Dobsonville Stadium <br /></p>
    <p class="share-prompt">
      Share this unique link with 5 friends via WhatsApp to qualify for the draw!
    </p>

    <p>shared with 5 friends:</p>
    <div class="counter-display">
      <span id="shareCount">0</span> / 5 Friends
    </div>

    <button id="whatsapp-share" class="share-button" onclick="promptShare()">
      1. Share on WhatsApp &rarr;
    </button>

    <button id="claim-button" class="share-button" disabled>
      2. Go to Job-Wise.co.za
    </button>
  </div>
</div>

<button onclick="openModal()">Open Bafana Bafana Ticket Promo</button>

<script>
  // --- MODAL CONTROL FUNCTIONS (NEW) ---
  const modal = document.getElementById("ticketModal");

  // Function to open the modal
  function openModal() {
    modal.classList.add("open");
  }

  // Function to close the modal
  function closeModal() {
    modal.classList.remove("open");
  }

  // Close the modal if the user clicks anywhere outside of the ticket-container
  window.onclick = function (event) {
    if (event.target == modal) {
      closeModal();
    }
  };

  // --- ORIGINAL SCRIPT (Updated to call close modal if successful) ---
  const TARGET_URL = "https://job-wise.co.za/";
  const SHARE_MESSAGE =
    "I found a way to win FREE Bafana Bafana vs. Ghana tickets on 16 Dec! You also need to check out this : " +
    window.location.href;

  const MIN_SHARES_REQUIRED = 5;

  let shareCount = parseInt(localStorage.getItem("jobWiseShareCount")) || 0;

  const countElement = document.getElementById("shareCount");
  const claimButton = document.getElementById("claim-button");

  function updateDisplay() {
    countElement.textContent = shareCount;

    if (shareCount >= MIN_SHARES_REQUIRED) {
      claimButton.classList.add("active");
      claimButton.disabled = false;
    } else {
      claimButton.classList.remove("active");
      claimButton.disabled = true;
    }
  }

  function promptShare() {
    const whatsappUrl =
      "whatsapp://send?text=" + encodeURIComponent(SHARE_MESSAGE);

    window.open(whatsappUrl, "_blank");

    shareCount = Math.min(shareCount + 1, MIN_SHARES_REQUIRED);
    localStorage.setItem("jobWiseShareCount", shareCount);

    updateDisplay();

    if (shareCount < MIN_SHARES_REQUIRED) {
      alert(
        `Great! Share with ${
          MIN_SHARES_REQUIRED - shareCount
        } more friends to unlock the draw!`
      );
    }
  }

  function redirectToJobWise() {
    if (shareCount >= MIN_SHARES_REQUIRED) {
      // **NEW**: Close the modal before redirecting
      closeModal();
      window.location.href = TARGET_URL;
    } else {
      alert(
        `You must share with at least ${MIN_SHARES_REQUIRED} friends first! You are currently at ${shareCount}.`
      );
    }
  }

  claimButton.onclick = redirectToJobWise;

  updateDisplay();
</script>
